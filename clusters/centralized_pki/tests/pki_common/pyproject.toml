[project]
name = "pki-common-tests"
version = "0.0.0"
description = "Hermetic unit tests for _pki_common (shared PKI CLI helpers)"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "pytest-mock>=3",
    "pytest-cov>=5",
    "pytest-randomly>=3",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["."]
# Make the single-file helper importable as `_pki_common` from scripts/.
pythonpath = ["../../scripts"]
filterwarnings = ["ignore::SyntaxWarning"]
