[project]
name = "macos-trust-cli-tests"
version = "0.0.0"
description = "Hermetic unit tests for macos_trust_cli (internal-CA host trust helper)"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "pytest-mock>=3",
    "pytest-cov>=5",
    "pytest-randomly>=3",
    "typer>=0.12",
    "rich>=13",
    "cryptography>=42",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["."]
pythonpath = ["../../scripts"]
filterwarnings = ["ignore::SyntaxWarning"]
