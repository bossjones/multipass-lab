[project]
name = "traefik-cli-tests"
version = "0.0.0"
description = "Hermetic unit tests for traefik_cli (fleet-edge reverse-proxy discovery/render/probe CLI)"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "pytest-mock>=3",
    "pytest-cov>=5",
    "pytest-randomly>=3",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["."]
pythonpath = ["../../scripts"]
filterwarnings = ["ignore::SyntaxWarning"]
