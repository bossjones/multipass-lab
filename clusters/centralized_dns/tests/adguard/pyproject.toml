[project]
name = "adguard-tests"
version = "0.0.0"
description = "Hermetic unit tests for centralized_dns adguard helpers/CLI"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "pytest-httpserver>=1.0",
    "pytest-mock>=3",
    "pytest-randomly>=3",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["."]
pythonpath = ["../../scripts"]
filterwarnings = ["ignore::SyntaxWarning"]
