# Managed by OpenTofu (centralized_dns) — hardened recursive resolver for AdGuard Home.
# Dropped into /etc/unbound/unbound.conf.d/ (Ubuntu's stock unbound.conf include:s it).
# Listens on 127.0.0.1:5335 ONLY — AdGuard Home (0.0.0.0:53) forwards here; nothing else
# may query it. Adapted from adguardhome-unbound-macos-setup/install.sh.
server:
    # ── Listening ────────────────────────────────────────────────
    interface: 127.0.0.1
    port: 5335
    # No dedicated user is managed here; the stock unbound.service already drops privileges.

    # ── Protocols ────────────────────────────────────────────────
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # ── Security / Hardening ─────────────────────────────────────
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    use-caps-for-id: yes

    # ── DNSSEC ───────────────────────────────────────────────────
    # Use the packaged root trust anchor (dns-root-data ships /var/lib/unbound/root.key);
    # unbound maintains it per RFC 5011. Root hints are compiled into unbound (no root-hints:
    # line — pointing it at a file that may not exist yet is a fatal start error).
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    val-clean-additional: yes

    # ── Privacy ──────────────────────────────────────────────────
    qname-minimisation: yes
    qname-minimisation-strict: no

    # ── Performance ──────────────────────────────────────────────
    num-threads: 2
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4
    msg-cache-size: 64m
    rrset-cache-size: 128m
    cache-min-ttl: 300
    cache-max-ttl: 86400
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400

    # ── Access Control ───────────────────────────────────────────
    # Only localhost (AdGuard Home) may query Unbound directly.
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::/0 refuse

    # ── Logging ──────────────────────────────────────────────────
    # Log to syslog so journald picks it up and the cross-cluster shipper forwards it.
    use-syslog: yes
    verbosity: 0
    log-queries: no
    log-replies: no
    log-servfail: yes

# ── Remote control ───────────────────────────────────────────────
# unbound_exporter (:9167) reads stats over this local unix socket. No TLS certs to manage
# since the exporter runs as root on the same host.
remote-control:
    control-enable: yes
    control-interface: /run/unbound.ctl
