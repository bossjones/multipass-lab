# Managed by OpenTofu (clusters/centralized_monitoring). Tells Grafana to load any
# dashboard JSON dropped under /var/lib/grafana/dashboards (provisioned via cloud-init).
# foldersFromFilesStructure: true makes each subdirectory (Instances/, Infrastructure/,
# Platform/, Kubernetes/) become a Grafana folder — so dropping a JSON into the right
# subdir is all it takes to publish and file a dashboard (see specs/dashboards.md).
apiVersion: 1

providers:
  - name: default
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
