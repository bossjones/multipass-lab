# Managed by OpenTofu (clusters/centralized_monitoring). blackbox_exporter module
# definitions. Prometheus's `blackbox` job references these by `module` param.
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: []
      preferred_ip_protocol: ip4
      fail_if_not_ssl: false

  tcp_connect:
    prober: tcp
    timeout: 5s

  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
