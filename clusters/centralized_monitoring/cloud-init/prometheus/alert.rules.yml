# Managed by OpenTofu (clusters/centralized_monitoring). Loaded by Prometheus as a
# rule_file. Lab-grade alerting: fire when a scrape target is down or a blackbox probe
# fails. Routed through Alertmanager (which defaults to a null receiver in the lab).
groups:
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target down: {{ $labels.job }} / {{ $labels.instance }}"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for >1m."

      - alert: BlackboxProbeFailed
        expr: probe_success == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Blackbox probe failed: {{ $labels.instance }}"
          description: "The blackbox probe of {{ $labels.instance }} has been failing for >1m."

  # Netdata host health (job="netdata"). Uses the `average` source (gauges in real units) that the
  # scrape job + Grafana dashboards standardize on. Agent-down is already covered by TargetDown
  # above. Verify exact metric/dimension names against a live endpoint before tightening thresholds:
  #   curl -s 'http://<vm>:19999/api/v1/allmetrics?format=prometheus' | grep _average
  # See specs/shared-netdata.md.
  - name: netdata
    rules:
      - alert: NetdataHostHighCPU
        expr: 100 - avg by (instance) (netdata_system_cpu_percentage_average{dimension="idle"}) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
          description: "Netdata reports >85% CPU (non-idle) on {{ $labels.instance }} for >10m."

      - alert: NetdataHostLowMemory
        # Use *available* memory (free + reclaimable cache/buffers), not the raw "free"
        # dimension — on Linux "free" excludes page cache and sits near-zero on healthy
        # hosts, so a free/total ratio tripped this alert fleet-wide. mem.available mirrors
        # `free -m`'s "available" column and only drops under genuine memory pressure.
        expr: netdata_mem_available_MiB_average / on(instance) group_left sum by (instance) (netdata_system_ram_MiB_average) < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low available memory on {{ $labels.instance }}"
          description: "Netdata reports <10% available RAM on {{ $labels.instance }} for >10m."

      - alert: NetdataHostRootDiskLow
        expr: netdata_disk_space_GiB_average{family="/",dimension="avail"} < 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low root disk space on {{ $labels.instance }}"
          description: "Netdata reports <3 GiB available on / for {{ $labels.instance }} for >10m."

      - alert: NetdataHostRootDiskWillFill
        expr: predict_linear(netdata_disk_space_GiB_average{family="/",dimension="avail"}[1h], 24 * 3600) < 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Root disk will fill within 24h on {{ $labels.instance }}"
          description: "Linear projection of / available space on {{ $labels.instance }} reaches 0 within 24h."
