[project]
name = "locust-tests"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "pytest-httpserver>=1.0",
    "pytest-mock>=3",
    "pytest-cov>=5",
    "pytest-randomly>=3",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "locust>=2.31",
    "faker>=30",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["."]
# Make the single-file CLI (`locust_cli`, `_obs_common`) and the locustfile
# (`monitoring`) importable from the cluster scripts dir.
pythonpath = ["../../scripts", "../../scripts/locustfiles"]
filterwarnings = ["ignore::SyntaxWarning"]
