[project]
name = "prometheus-cli-tests"
version = "0.0.0"
description = "Hermetic unit tests for prometheus_cli (Prometheus verification CLI)"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "pytest-httpserver>=1.0",
    "pytest-mock>=3",
    "pytest-cov>=5",
    "pytest-randomly>=3",
    "typer>=0.12",
    "rich>=13",
    "prometheus-api-client>=0.5",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["."]
pythonpath = ["../../scripts"]
filterwarnings = ["ignore::SyntaxWarning"]
