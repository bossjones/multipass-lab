[project]
name = "grafana-cli-tests"
version = "0.0.0"
description = "Hermetic unit tests for grafana_cli (Grafana verification CLI)"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "pytest-httpserver>=1.0",
    "pytest-mock>=3",
    "pytest-cov>=5",
    "pytest-randomly>=3",
    "typer>=0.12",
    "rich>=13",
    "grafana-client>=5",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["."]
# Make the single-file CLI importable as `grafana_cli` / `_obs_common` from scripts/.
pythonpath = ["../../scripts"]
filterwarnings = ["ignore::SyntaxWarning"]
